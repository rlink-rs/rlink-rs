[package]
name = "rlink"
version = "0.6.16"
authors = ["yorkart <wangyue11.4@163.com>"]
edition = "2021"
description = "High performance Stream Processing Framework"
keywords = ["stream", "window", "flink"]
repository = "https://github.com/rlink-rs/rlink-rs.git"
license = "MIT OR Apache-2.0"

[lib]
name = "rlink"

[dependencies]
serbuffer = "1.3"

log = "0.4"
log4rs = "1.4"

num_cpus = "1.16"
thread-id = "4"
sysinfo = "0.33"
chrono = "0.4"
lazy_static = "1.5"
async-trait = "0.1"
backtrace = "0.3"
anyhow = "1.0"
thiserror = "2.0"
daggy = "0.8.0"
hostname = "0.4"
dns-lookup = "2.0"
atomic_enum = "0.3"

# randomness
rand = "0.8"

# serialization
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_yml = "0.0.12"

# hash code
murmur3 = "0.5"
dashmap = "6.1"
crossbeam = "0.8"

metrics = "0.24"
metrics-util = "0.20"
metrics-exporter-prometheus = "0.16"

# net
bytes = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# storage
mysql_async = "0.34"

# kubernetes
kube = { version = "0.98" }
kube-runtime = { version = "0.98" }
k8s-openapi = { version = "0.24", features = ["v1_32"]}

[dev-dependencies]
uuid = { version = "1.19", features = ["serde", "v4"] }
